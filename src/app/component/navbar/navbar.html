<p>navbar works!</p>


<mat-sidenav #drawer mode="over" *ngIf="rol === 'ROLE_ADMIN'">
  <mat-nav-list>
    <a mat-list-item routerLink="/categorias" (click)="closeDrawer()">
      <mat-icon>category</mat-icon>
      <span>Categorías</span>
    </a>

    <a mat-list-item routerLink="/productos" (click)="closeDrawer()">
      <mat-icon>inventory_2</mat-icon>
      <span>Productos</span>
    </a>

    <a mat-list-item routerLink="/pedidos" (click)="closeDrawer()">
      <mat-icon>shopping_basket</mat-icon>
      <span>Pedidos</span>
    </a>

    <a mat-list-item routerLink="/detallePedidos" (click)="closeDrawer()">
      <mat-icon>receipt</mat-icon>
      <span>Detalles de pedidos</span>
    </a>
  </mat-nav-list>
</mat-sidenav>

<mat-sidenav-content>
  <mat-toolbar class="toolbar">
    <div class="brand-group">
      <button mat-icon-button class="menu-button" *ngIf="rol === 'ROLE_ADMIN'" (click)="toggleDrawer()">
        <mat-icon>menu</mat-icon>
      </button>

      <a class="titulo" routerLink="/productos">
        <span class="titulo-icon">☕</span>
        <span class="titulo-texto">BuenCafe</span>
      </a>
    </div>

    <span class="spacer"></span>

    <div class="toolbar-actions">
      <button mat-icon-button class="action-button" routerLink="/mis-pedidos" aria-label="Mis pedidos">
        <mat-icon>turned_in</mat-icon>
      </button>

      <button mat-icon-button class="action-button" routerLink="/pedido" aria-label="Carrito">
        <mat-icon>shopping_cart</mat-icon>
      </button>

      <span class="usuario" *ngIf="username">
            👤 {{ username }}
          </span>

      <button mat-icon-button class="action-button logout-button" (click)="logout()" aria-label="Cerrar sesión">
        <mat-icon>exit_to_app</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <div class="contenido">
    <router-outlet></router-outlet>
  </div>
</mat-sidenav-content>
