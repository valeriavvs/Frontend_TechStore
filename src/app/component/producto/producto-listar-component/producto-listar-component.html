<div class="productos-page">
  <div class="header">
	<div>
	  <h1>Productos</h1>
	  <p>{{ etiquetaRol }}</p>
	</div>
	<div class="actions icon-actions" *ngIf="esAdmin">
	  <a class="btn icon-btn" routerLink="/productos/registrar" aria-label="Gestionar productos" title="Gestionar productos">
		<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
		  <path d="M11 2v3.1a7 7 0 0 0-2.28.95L6.5 3.83 3.83 6.5l2.22 2.22A7 7 0 0 0 5.1 11H2v2h3.1c.17.8.49 1.56.95 2.28L3.83 17.5 6.5 20.17l2.22-2.22c.72.46 1.48.78 2.28.95V22h2v-3.1a7 7 0 0 0 2.28-.95l2.22 2.22 2.67-2.67-2.22-2.22c.46-.72.78-1.48.95-2.28H22v-2h-3.1a7 7 0 0 0-.95-2.28l2.22-2.22-2.67-2.67-2.22 2.22A7 7 0 0 0 13 5.1V2h-2zm1 7a3 3 0 1 1 0 6 3 3 0 0 1 0-6z" />
		</svg>
	  </a>
	  <a class="btn icon-btn secondary" routerLink="/usuarios/actualizar" aria-label="Actualizar usuarios" title="Actualizar usuarios">
		<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
		  <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.42 0-8 2.24-8 5v1h12.46A6 6 0 0 1 22 14.46V14.3A11.8 11.8 0 0 0 12 14zm8.71 1.29-1.42-1.42-4.59 4.59-1.41-1.42-1.42 1.42 2.83 2.83z" />
		</svg>
	  </a>
	  <a class="btn icon-btn secondary" routerLink="/pedidos" aria-label="Ver pedidos" title="Ver pedidos">
		<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
		  <path d="M4 2h11l5 5v15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm10 1.5V8h4.5L14 3.5zM6 12h12v2H6v-2zm0 4h12v2H6v-2zm0-8h6v2H6V8z" />
		</svg>
	  </a>
	  <button type="button" class="btn icon-btn danger" (click)="logout()" aria-label="Cerrar sesion" title="Cerrar sesion">
		<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
		  <path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5v-2H5V5h5V3zm9.3 8.3-2.6-2.6-1.4 1.4 1.3 1.3H9v2h7.6l-1.3 1.3 1.4 1.4 2.6-2.6a1 1 0 0 0 0-1.4z" />
		</svg>
	  </button>
	</div>
	<div class="actions icon-actions" *ngIf="!esAdmin">
	  <a class="btn icon-btn secondary" routerLink="/mis-pedidos" aria-label="Historial de compras" title="Historial de compras">
		<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
		  <path d="M13 3a9 9 0 1 0 8.95 10h-2.02A7 7 0 1 1 13 5V3zm1 1v8l6.4 3.7 1-1.73L16 10.8V4h-2z" />
		</svg>
	  </a>
	  <a class="btn icon-btn" routerLink="/carrito" aria-label="Ver carrito" title="Ver carrito">
		<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
		  <path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM6.2 6l.6 3h12.1a1 1 0 0 1 .97 1.24l-1.2 5A1 1 0 0 1 17.67 16H8a1 1 0 0 1-.98-.8L4.2 2H2V0h3a1 1 0 0 1 .98.8L6.2 6z" />
		</svg>
	  </a>
	  <button type="button" class="btn icon-btn danger" (click)="logout()" aria-label="Cerrar sesion" title="Cerrar sesion">
		<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
		  <path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5v-2H5V5h5V3zm9.3 8.3-2.6-2.6-1.4 1.4 1.3 1.3H9v2h7.6l-1.3 1.3 1.4 1.4 2.6-2.6a1 1 0 0 0 0-1.4z" />
		</svg>
	  </button>
	</div>
  </div>

  <section class="panel">
	<div class="catalog-header">
	  <input
		type="text"
		class="search-input"
		placeholder="Buscar producto por nombre"
		[value]="terminoBusqueda"
		(input)="actualizarBusqueda($any($event.target).value)"
	  />
	  <h2>Catalogo</h2>
	</div>

	<div class="estado" *ngIf="cargando">Cargando productos...</div>
	<div class="estado" *ngIf="!cargando && productos.length === 0">No hay productos disponibles.</div>
	<div class="estado" *ngIf="!cargando && productos.length > 0 && productosFiltrados.length === 0">
	  No se encontraron productos con ese nombre.
	</div>

	<div class="grid" *ngIf="!cargando && productosFiltrados.length > 0">
	  <article class="card" *ngFor="let producto of productosFiltrados">
		<img [src]="getImagenProducto(producto)" [alt]="producto.nombre" (error)="onErrorImagen($event)" />

		<div class="content">
		  <div class="title-row">
			<h3>{{ producto.nombre }}</h3>
			<div class="title-actions" *ngIf="esAdmin">
			  <button
				type="button"
				class="eye-btn"
				[class.off]="!producto.activo"
				(click)="toggleActivo(producto)"
				[attr.aria-label]="producto.activo ? 'Desactivar producto' : 'Activar producto'"
				[title]="producto.activo ? 'Activo' : 'Inactivo'"
			  >
				<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
				  <path d="M12 5c5 0 9 3.2 10.8 7-1.8 3.8-5.8 7-10.8 7S3 15.8 1.2 12C3 8.2 7 5 12 5zm0 2C8.1 7 4.8 9.4 3.3 12 4.8 14.6 8.1 17 12 17s7.2-2.4 8.7-5C19.2 9.4 15.9 7 12 7zm0 2.2a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6z" />
				  <path *ngIf="!producto.activo" d="M4 4l16 16" />
				</svg>
			  </button>

			  <a
				class="edit-btn"
				[routerLink]="['/productos/registrar']"
				[queryParams]="{ id: producto.id }"
				[state]="{ producto: producto }"
				aria-label="Editar producto"
				title="Editar producto"
			  >
				<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
				  <path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zm16.7-10.54a1 1 0 0 0 0-1.41l-1.99-1.99a1 1 0 0 0-1.41 0l-1.56 1.56 3.75 3.75 1.21-1.91z" />
				</svg>
			  </a>
			</div>
		  </div>
		  <p>{{ producto.descripcion }}</p>

		  <div class="meta">
			<span>S/ {{ producto.precio | number: '1.2-2' }}</span>
			<div class="stock-row">
			  <span>Stock: {{ producto.stock }}</span>

			  <select
				*ngIf="!esAdmin"
				class="qty-select"
				[disabled]="producto.stock <= 0"
				[value]="getCantidadSeleccionada(producto)"
				(change)="actualizarCantidadSeleccionada(producto, $any($event.target).value)"
			  >
				<option *ngIf="producto.stock <= 0" [value]="0">Sin stock</option>
				<option *ngIf="producto.stock > 0" [value]="0">0</option>
				<option *ngFor="let cantidad of getOpcionesCantidad(producto.stock)" [value]="cantidad">
				  {{ cantidad }}
				</option>
			  </select>
			</div>

			<button *ngIf="!esAdmin" type="button" class="add-cart-btn" [disabled]="producto.stock <= 0 || estaAgregando(producto)" (click)="agregarAlCarrito(producto)">
			  {{ estaAgregando(producto) ? 'Agregando...' : 'Agregar al carrito' }}
			</button>
		  </div>
		</div>
	  </article>
	</div>
  </section>
</div>
